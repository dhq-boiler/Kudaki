# Kudaki release automation.
#
# トリガー: dhq-boiler/Kudaki repo に "v*" tag を push すると発火。
# 成果物: Kudaki repo の Release に KudakiSetup.exe を upload。
#
# ビルド手順 (README の "Building from source" と同じ):
#   1. Kudaki.App を self-contained publish
#   2. その出力を Payload/Kudaki-payload.zip に固める
#      (Kudaki.Installer.csproj が EmbeddedResource として同梱する)
#   3. Kudaki.Installer を single-file self-contained publish → KudakiSetup.exe
#   4. CHANGELOG.md から該当バージョンのセクションを抜いて release notes にする
#
# 権限:
#   contents: write ─ GITHUB_TOKEN で Release を作成・upload するために必要。追加 PAT 不要。
#
# 注意:
#   Kudaki は Velopack を使っていない (自前の Kudaki.Installer 方式)。
#   auto update / delta 更新が欲しくなったら Velopack 導入を別途検討する
#   (Kata = C:\Git\ClassDesign が Velopack pattern の参考実装)。

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract version (strip leading v)
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} (tag ${TAG})"

      - name: Publish Kudaki.App (Release, self-contained win-x64)
        run: |
          dotnet publish src/Kudaki.App/Kudaki.App.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o publish/Kudaki.App

      - name: Pack payload zip for the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/Kudaki.Installer/Payload | Out-Null
          Compress-Archive -Path publish/Kudaki.App/* `
                           -DestinationPath src/Kudaki.Installer/Payload/Kudaki-payload.zip `
                           -Force
          $zip = Get-Item src/Kudaki.Installer/Payload/Kudaki-payload.zip
          Write-Host "payload: $($zip.Length) bytes"

      - name: Publish Kudaki.Installer (Release, single-file self-contained)
        run: |
          dotnet publish src/Kudaki.Installer/Kudaki.Installer.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o publish/Kudaki.Installer

      # CHANGELOG.md の "## [x.y.z]" から次の "## [" 直前までを抜き出して release notes に。
      # 該当セクションが無い場合は空になるので、その場合は --generate-notes に fallback する。
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "--- release notes ---"
            cat release-notes.md
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG section for ${VERSION}; will use auto-generated notes."
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          ASSET="publish/Kudaki.Installer/KudakiSetup.exe"

          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            NOTES_ARG=(--notes-file release-notes.md)
          else
            NOTES_ARG=(--generate-notes)
          fi

          if gh release view "$TAG" --repo dhq-boiler/Kudaki >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading asset with --clobber."
            gh release upload "$TAG" "$ASSET" --repo dhq-boiler/Kudaki --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --repo dhq-boiler/Kudaki \
              --title "Kudaki ${VERSION}" \
              "${NOTES_ARG[@]}"
          fi
