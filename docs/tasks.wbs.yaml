  notes: バージョンと変更履歴を更新し、リリース対象の検証、タグの公開、GitHub Actions とインストーラー添付を確認する。 2026-09-12：公開コミット 78ad735 を独立した作業ディレクトリの Release 構成で検証（保存3件・F2関連4件成功）。v0.7.2 タグを push、GitHub Actions 34680309243 成功。正式リリース公開と KudakiSetup.exe（146283478 bytes）の添付を確認。https://github.com/dhq-boiler/Kudaki/releases/tag/v0.7.2
