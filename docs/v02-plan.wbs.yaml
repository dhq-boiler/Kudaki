version: 2
title: Kudaki v0.2 — MCP + diff承認
createdAt: 2026-09-01T00:00:00Z
modifiedAt: 2026-09-01T00:00:00Z
tasks:
- id: sec-design
  title: 設計
  children:
  - id: t-arch
    title: アーキテクチャ確定 (in-process HTTP vs stdio 別プロセス)
    estimateHours: 4
    remainingHours: 0
    notes: |
      確定 (2026-09-01):
      - Transport: Streamable HTTP (stateless モード)。MCP 2025 仕様の最新。
        従来 SSE と違い session を持たないので、propose_changes の
        承認 await は 1 リクエスト内の TaskCompletionSource で完結する。
      - Host: Kudaki.App プロセス内で ASP.NET Core Kestrel を起こす。
      - Library: ModelContextProtocol.AspNetCore 2.2.0
        (.WithHttpTransport(o => o.Stateless = true))
  - id: t-tools
    title: MCP ツール定義 (get_document / propose_changes / get_pending_summary)
    estimateHours: 3
    notes: |
      propose_changes は同期 await 方式で、AI から見ると1回呼んで結果を待つだけ。
      get_pending_summary はフォールバック用。
  - id: t-diff-model
    title: Diff データモデル設計 (PendingChange, FieldDiffs)
    estimateHours: 3
    remainingHours: 0
    notes: |
      2026-09-01 完了。Models/PendingChange.cs: enum PendingChangeOp {Add, Update, Delete},
      FieldDiff { FieldName, Before, After }, PendingChange { Op, TaskId, ParentId,
      Before, After, FieldDiffs }。
  - id: t-approval
    title: 承認フロー設計 (all-or-nothing 一括承認)
    estimateHours: 2
    notes: 個別承認は v0.3 で検討。
- id: sec-server
  title: MCP サーバー基盤
  children:
  - id: t-nuget
    title: ModelContextProtocol NuGet 導入 と依存追加
    estimateHours: 1
    remainingHours: 0
    notes: 2026-09-01 完了 (ModelContextProtocol.AspNetCore 2.2.0)。
  - id: t-kestrel
    title: Kestrel in-process ホスト起動 (localhost 任意ポート)
    estimateHours: 4
    remainingHours: 0
    notes: |
      2026-09-01 完了。
      - WPF プロセスから ASP.NET Core を使うには FrameworkReference
        Microsoft.AspNetCore.App が必要 (パッケージだけだと Kestrel 拡張が見えない)。
      - builder.WebHost.UseUrls("http://localhost:27650") で固定ポート。
      - MapMcp("/mcp") で /mcp エンドポイントに公開。
  - id: t-lifecycle
    title: サーバー起動/停止のライフサイクル管理 (App.OnStartup / OnExit)
    estimateHours: 2
    remainingHours: 0
    notes: |
      2026-09-01 完了。OnStartup で Task.Run による fire-and-forget 起動、
      OnExit で StopAsync().GetAwaiter().GetResult() で同期待ち停止。
  - id: t-registration
    title: MCP tool 登録の骨組み
    estimateHours: 3
    remainingHours: 0
    notes: |
      2026-09-01 完了。.WithHttpTransport(o => o.Stateless = true) + .WithToolsFromAssembly()
      で Kudaki.App アセンブリ内の [McpServerToolType] 属性クラスを自動発見。
- id: sec-tools
  title: MCP ツール実装
  children:
  - id: t-get-doc
    title: get_document ツール (読取専用、現在の WbsDocument を返す)
    estimateHours: 2
    remainingHours: 0
    notes: |
      2026-09-01 完了。MainViewModel.Current (static bridge) を経由して
      現在の WbsDocument を YamlStorageService.SerializeToString で YAML 化。
      Kestrel の別スレッドから呼ばれるので Application.Current.Dispatcher.Invoke で
      UI スレッドに戻して snapshot する。動作確認: deps-demo.wbs.yaml の全ツリー
      が MCP tools/call レスポンスで JSON 経由で返ってくることを確認済み。
  - id: t-propose
    title: propose_changes ツール (提案受付 + 承認/却下を await して返す)
    estimateHours: 6
    remainingHours: 0
    notes: |
      2026-09-01 完了。PendingChangesService (singleton) が
      ObservableCollection<PendingChangeSet> と TaskCompletionSource で
      SubmitAsync → Approve/Reject/TimedOut を返す。MCP tool 側は Approved 時に
      MainViewModel.ApplyProposedDocument(proposed) を Dispatcher.InvokeAsync で
      UI スレッド上で実行。承認 UI は t-panel/t-colors/t-approve-btn (未着手) で
      Pending にバインドする形。動作確認: timeout=5s で MODIFIED yaml を送って
      正確に 5.01s 後に {"result":"timeout"} が返ることを検証済み。
  - id: t-summary
    title: get_pending_summary ツール (現在ペンディング中の変更概要)
    estimateHours: 2
  - id: t-errors
    title: エラー / タイムアウト処理 + ロギング
    estimateHours: 3
- id: sec-diff
  title: Diff エンジン
  children:
  - id: t-compare
    title: WbsDocument 比較 (id ベース照合、Guid が安定していることを前提)
    estimateHours: 4
    remainingHours: 0
    notes: |
      2026-09-01 完了。Services/Mcp/DiffCalculator.Compare(current, proposed):
      Flatten で id → (Node, ParentId) の辞書化 → set except で Add/Delete、
      intersect で Update 候補を出して CompareFields で個別フィールド差分。
  - id: t-pending
    title: PendingChange 生成 (Op=Add/Update/Delete + FieldDiffs)
    estimateHours: 6
    remainingHours: 0
    notes: |
      2026-09-01 完了。CompareFields で Title/EstimateHours/RemainingHours/
      Assignee/DueDate/Notes/PredecessorIds/ParentId を diff、FieldDiff リストに
      展開。未対応 (t-subtree で対応予定): subtree Add/Delete の畳み込み。
      既知の課題: get_document → propose_changes の round-trip で SAME 判定に
      予期せぬ差分が出る (未調査、t-diff-test で切り分ける)。
  - id: t-subtree
    title: ネスト subtree の Add / Delete をまとめて1つの PendingChange に
    estimateHours: 4
  - id: t-diff-test
    title: Unit test (round-trip / 順序入れ替え / subtree の挙動)
    estimateHours: 4
- id: sec-ui
  title: Diff 承認 UI
  children:
  - id: t-panel
    title: Diff Panel の XAML レイアウト (右サイドバーに追加)
    estimateHours: 4
  - id: t-colors
    title: 追加/削除/変更の色分け (緑/赤/オレンジ、既存パレット準拠)
    estimateHours: 3
  - id: t-approve-btn
    title: 承認 / 却下ボタンと確認フロー
    estimateHours: 3
  - id: t-apply
    title: 承認時の PendingChanges → Document 反映処理
    estimateHours: 4
  - id: t-notify
    title: サーバー側 await 中コールへの結果通知 (TaskCompletionSource.SetResult)
    estimateHours: 3
- id: sec-settings-docs
  title: 設定 UI + ドキュメント
  children:
  - id: t-toggle
    title: MCP サーバー ON/OFF トグル (プロパティパネル外の設定エリア)
    estimateHours: 2
  - id: t-port
    title: リッスンポート表示 (Claude Code 用に URL コピー可)
    estimateHours: 2
  - id: t-readme
    title: README に MCP セクション追記
    estimateHours: 2
  - id: t-mcp-json
    title: Claude Code 側の登録手順 (mcp.json 例) を docs/ に配置
    estimateHours: 2
